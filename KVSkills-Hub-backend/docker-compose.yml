services:
  app:
    build: .
    ports:
      - "8080:80"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - kvskills_uploads:/var/www/html/storage/private/uploads
      - kvskills_logs:/var/www/html/storage/logs
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - kvskills_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  kvskills_db:
  kvskills_uploads:
  kvskills_logs:
